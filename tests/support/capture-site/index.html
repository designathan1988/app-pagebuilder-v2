<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grão Norte</title>
<link rel="stylesheet" href="assets/site.css">
<style>.lead { color: #7a3e1d; }</style>
</head>
<body>
<header class="top"><h1 class="brand">Grão Norte</h1></header>
<main>
<p class="lead">Fresh coffee, roasted every week.</p>
<img class="cup" src="assets/cup.svg" alt="A cup">
<div class="band"></div>
<a class="more" href="/plans/">See the plans</a>
<x-badge class="badge">Fresh</x-badge>
</main>
<script>
customElements.define('x-badge', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = '<style>:host { display: block; } p { color: rgb(185, 81, 42); }</style><p><slot></slot> beans</p>';
  }
});
</script>
<script>document.querySelector('.lead').insertAdjacentHTML('afterend', '<p class="late">Added by a script</p>');</script>
</body>
</html>
